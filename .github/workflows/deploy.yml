name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt an active production deployment. PR checks can be replaced.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test iceberg content and board layout
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          response_file="${RUNNER_TEMP}/pages-site.json"
          status="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages")"

          if [[ "${status}" == "404" ]]; then
            echo "::error title=GitHub Pages is not enabled::Open https://github.com/${GITHUB_REPOSITORY}/settings/pages and set Build and deployment → Source to GitHub Actions. Pages must be enabled in repository settings; the default GITHUB_TOKEN cannot create a Pages site. Since this repository is private, the account plan must support Pages from private repositories."
            exit 1
          fi

          if [[ "${status}" != "200" ]]; then
            echo "::error title=Cannot read GitHub Pages configuration::The Pages API returned HTTP ${status}. Check the deploy job's Pages permissions."
            exit 1
          fi

          build_type="$(jq -r '.build_type // empty' "${response_file}")"
          if [[ "${build_type}" != "workflow" ]]; then
            echo "::error title=GitHub Pages is not configured for Actions::Open https://github.com/${GITHUB_REPOSITORY}/settings/pages and set Build and deployment → Source to GitHub Actions."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5